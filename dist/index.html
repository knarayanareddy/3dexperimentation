// Generative Model:     P(token_{t+1} | tokens_{1..t}) -> Loop until <EOS>
// Discriminative Model: P(Class_k | State, Criteria)   -> Single Matrix Pass!`},{id:"s5-2",chapterId:"ch5",startTime:130,endTime:138,cue:"A generator writes one token, feeds it back into itself, and writes the next, over and over, hundreds of times.",read:"An animation of a typewriter typing letter by letter while a ticking clock sweeps around.",speaker:"Engineer",visualPrompt:'A mechanical typewriter chugging letter by letter: "I", " ", "t", "h", "i", "n", "k"...',technicalNote:"Autoregressive generation has O(N) sequential step latency and requires KV caching and token sampling.",codeSnippet:`// Autoregressive Loop (O(N) passes):
for (let step = 0; step < 120; step++) {
  const nextToken = sample(softmax(W_unembed * hiddenState));
  hiddenState = forward(hiddenState, nextToken); // 20ms * 120 = 2400ms!
}`},{id:"s5-3",chapterId:"ch5",startTime:138,endTime:147,cue:"Jev scores every candidate you gave it at once, in a single forward pass. That's where seventy milliseconds comes from.",read:"A laser sweep passes through all candidates at once; softmax probabilities light up simultaneously in one pulse.",speaker:"Narrator",visualPrompt:"A single high-speed laser pulse illuminating a 3D matrix of candidate vectors instantly in green light.",technicalNote:"One forward pass computes cross-attention between state tokens and candidate criterion embeddings.",codeSnippet:`// Jev Single Forward Pass (O(1) forward pass):
const stateEmbeds = encoder(state);
const candidateScores = crossAttention(stateEmbeds, criteriaEmbeds);
const probabilities = softmax(candidateScores); // 70 milliseconds total!`},{id:"s5-4",chapterId:"ch5",startTime:147,endTime:156,cue:"Which means it cannot ramble, cannot forget a brace, cannot invent an option. The probabilities always sum to one.",read:"A golden lock snaps shut around the schema, guaranteeing 100% type safety.",speaker:"Clawd",visualPrompt:"A golden mathematical shield with zero variance, blocking red glitch artifacts.",technicalNote:"Output space is constrained by the request schema at the mathematical level, not via constrained decoding hacks.",codeSnippet:`// Mathematical Guarantees:

// smaller + aligned beat bigger + raw`},{id:"oa3-4",chapterId:"oa3",startTime:88,endTime:96,speaker:"Caret",cue:"November the thirtieth, 2022. They put a text box on the internet as a research preview, and a hundred million people arrive in two months.",read:"The chat box appears, small and plain; crowds of tiny figures stream toward it from every edge.",visualPrompt:"Plain chat box glowing, converging crowd, counter climbing.",technicalNote:"ChatGPT launched 30 November 2022 as a research preview and was reported to reach ~100M monthly users within about two months.",codeSnippet:`the model had existed for months.
the box was new.

  research preview, 30 Nov 2022
  ~100,000,000 users in ~2 months`}]},{id:"oa4",number:4,title:"Five Days in November",subtitle:"2023: GPT-4, the whole world shipping, and the week the company nearly ended",startTime:96,endTime:130,duration:34,themeColor:"#E2574C",accentColor:"#F09A92",summary:"The most capable model yet, a global race it triggered, and then an internal crisis that answered the question of who actually controls the thing.",shots:[{id:"oa4-1",chapterId:"oa4",startTime:96,endTime:104,speaker:"Narrator",cue:"March 2023. GPT-4 arrives, it accepts images as well as text, and it starts scoring near the top of exams written for people.",read:"The bloom gains a second ring; exam score bars rise past a dotted human line.",visualPrompt:"Bloom with outer ring, benchmark bars crossing a human-median line.",technicalNote:"GPT-4 (March 2023) was multimodal on input and scored in high percentiles on a range of professional and academic exams.",codeSnippet:`GPT-4, Mar 2023
  input:  text + images
  output: text
  exams:  top-decile on several professional tests
// capability stopped being the bottleneck`},{id:"oa4-2",chapterId:"oa4",startTime:104,endTime:112,speaker:"Scientist",cue:"Everybody ships. Every large lab reprioritises, every product grows a chat panel, and governments start drafting rules in a hurry.",read:"A city of panels lights up one after another; a row of officials unrolls a long scroll of rules.",visualPrompt:"Grid of competing product panels igniting, officials with a long scroll.",technicalNote:"The launch reset the competitive landscape and accelerated legislative work, including the EU AI Act negotiations.",codeSnippet:`t+0   one chat box
t+6mo every major lab has one
t+12mo every product has one
t+18mo three continents are drafting law`},{id:"oa4-3",chapterId:"oa4",startTime:112,endTime:121,speaker:"Chair",cue:"Then on the seventeenth of November the board removes the chief executive, saying he had not been consistently candid with them.",read:"A boardroom; the lights drop; a chair at the head of the table is suddenly empty.",visualPrompt:"Dark boardroom, long table, one empty chair under a cold light.",technicalNote:"On 17 November 2023 the board removed Sam Altman as CEO; the CTO was appointed interim CEO and the president resigned the same day.",codeSnippet:`17 Nov 2023, 12:00 PT
  board vote: remove the CEO
  stated reason: "not consistently candid"
// the governance structure finally did something`},{id:"oa4-4",chapterId:"oa4",startTime:121,endTime:130,speaker:"Narrator",cue:"Within three days, seven hundred and forty-five of about seven hundred and seventy employees sign one letter. By the twenty-second he is back.",read:"Signatures fill a single sheet until it is solid with ink; the empty chair is filled again.",visualPrompt:"Letter filling with signatures, counter racing to 745, chair refilled.",technicalNote:"By 20 November a letter signed by 745 of ~770 employees demanded the board resign; Altman returned on 22 November with a new initial board.",codeSnippet:`745 / 770 signed
  demand: reinstate, and the board resigns
  result: both
// the staff turned out to be the real board`}]},{id:"oa5",number:5,title:"Senses and Second Thoughts",subtitle:"2024: voice, video, and a model that stops to think before it answers",startTime:130,endTime:162,duration:32,themeColor:"#2F6FEB",accentColor:"#8AB0F5",summary:"The model gains ears and eyes and a voice — and then a different axis of progress opens up: not a bigger model, but one that is allowed to think for longer.",shots:[{id:"oa5-1",chapterId:"oa5",startTime:130,endTime:138,speaker:"Caret",cue:"May 2024. One model takes speech, images and text through the same door, and answers out loud in about the time a person would.",read:"Three streams — a waveform, a photograph, a line of letters — converge into a single glowing arch.",visualPrompt:"Waveform, image and text merging into one arch, Caret listening.",technicalNote:"GPT-4o handled audio, vision and text in a single model, cutting spoken-response latency to roughly conversational speed.",codeSnippet:`before: speech->text, text->text, text->speech

after:  one model, audio in, audio out
        ~0.3 s — close to a human turn`},{id:"oa5-2",chapterId:"oa5",startTime:138,endTime:146,speaker:"Scientist",cue:"Then September. A model trained to reason first and answer second — it spends seconds thinking, and the hard problems start falling.",read:"The bloom slows and a thinking ring orbits it; a hard problem resolves after a visible pause.",visualPrompt:"Bloom with orbiting thinking ring, timer counting, problem resolving.",technicalNote:"The o-series used reinforcement learning on long chains of reasoning, trading inference time for accuracy on maths, code and science.",codeSnippet:`scaling, axis 2

  TEST-time compute   ── new: think longer, score higher
// the answer improves while you wait`},{id:"oa5-3",chapterId:"oa5",startTime:146,endTime:154,speaker:"Narrator",cue:"And it learns to make video. A paragraph of description becomes a moving shot, with objects that mostly stay themselves.",read:"A written line unspools into a strip of film frames that animate as the strip slides past.",visualPrompt:"Text unspooling into a filmstrip, frames animating in sequence.",technicalNote:"Sora generated video from text, treating patches across space and time the way earlier models treated tokens.",codeSnippet:`image: patches over space
video: patches over space AND time
// same recipe, one more dimension`},{id:"oa5-4",chapterId:"oa5",startTime:154,endTime:162,speaker:"Scientist",cue:"But people leave. Several of the researchers who built the safety work depart, arguing that the race is outrunning the guardrails.",read:"Scaffolding around the bloom; a few figures set down their tools and walk out of frame.",visualPrompt:"Safety scaffolding half-built, researchers departing, bloom still growing.",technicalNote:"During 2024 several senior safety researchers left, publicly arguing that safety culture was being deprioritised against shipping.",codeSnippet:`the recurring argument:
  capability curve  ── exponential
  assurance curve   ── linear, at best
// the gap between them is the whole debate`}]},{id:"oa6",number:6,title:"The Furnace",subtitle:"2025: half a trillion in concrete, and a nonprofit that becomes a shareholder",startTime:162,endTime:192,duration:30,themeColor:"#3A3F4B",accentColor:"#C7D0DA",summary:"Progress becomes a construction project. The money required to keep the line straight finally reshapes the organisation that drew it.",shots:[{id:"oa6-1",chapterId:"oa6",startTime:162,endTime:170,speaker:"Narrator",cue:"January 2025. A joint venture is announced to spend up to five hundred billion dollars building data centres in the United States.",read:"A desert plain; foundations are poured and halls of racks rise row after row to the horizon.",visualPrompt:"Desert construction, rising server halls receding to the horizon.",technicalNote:"The Stargate project was announced in January 2025 by OpenAI with SoftBank, Oracle and MGX, planning up to $500B of US AI infrastructure.",codeSnippet:`Stargate, announced Jan 2025
  target: up to $500,000,000,000
  horizon: four years
// the roadmap is now partly a civil works programme`},{id:"oa6-2",chapterId:"oa6",startTime:170,endTime:178,speaker:"Scientist",cue:"Because the straight line has a price. Every step along it costs more power, more silicon and more concrete than the step before.",read:"The scaling line returns, now resting on a stack of substations, racks and transformers that grows beneath it.",visualPrompt:"Scaling line supported by growing infrastructure stack, power pylons.",technicalNote:"Each order-of-magnitude of capability has required roughly an order of magnitude more compute, power and capital.",codeSnippet:`to move the loss one notch:
  compute  x10
  power    x10
  capital  x10
// the physics bill arrives before the revenue`},{id:"oa6-3",chapterId:"oa6",startTime:178,endTime:185,speaker:"Chair",cue:"So in October the structure changes again. The for-profit becomes a public benefit corporation, and the nonprofit becomes its largest mission shareholder.",read:"The two-panel diagram from act two redraws itself: the cap dissolves, the nonprofit keeps the controlling thread.",visualPrompt:"Structure diagram redrawing, cap meter dissolving, control thread held.",technicalNote:"On 28 October 2025 OpenAI recapitalised: the for-profit became OpenAI Group PBC, controlled by the renamed OpenAI Foundation (~26%), with Microsoft at ~27%.",codeSnippet:`28 Oct 2025
  for-profit -> OpenAI Group PBC
  nonprofit  -> OpenAI Foundation, ~26%, in control
  Microsoft  -> ~27%
  profit cap -> removed`},{id:"oa6-4",chapterId:"oa6",startTime:185,endTime:192,speaker:"Narrator",cue:"The promise stays in the charter. Whether a corporation can keep it is the experiment everybody is now inside of.",read:"The 2015 letter reappears, pinned beside the new structure; the original sentence still legible.",visualPrompt:"Original letter pinned next to the new corporate diagram, same sentence.",technicalNote:"The Foundation retains control and a stake that grows at valuation milestones; the PBC form obliges the company to weigh its stated public benefit.",codeSnippet:`the sentence is unchanged since 2015.
the entity around it is unrecognisable.
// that tension is the story, not a footnote`}]},{id:"oa7",number:7,title:"A Billion Conversations",subtitle:"2026 → next: the scale it reached, and the question it still has not answered",startTime:192,endTime:216,duration:24,themeColor:"#10A37F",accentColor:"#7FE0C4",summary:"Eleven years from a letter: a billion people a week typing into a box, tens of billions in revenue, and the original promise still outstanding.",shots:[{id:"oa7-1",chapterId:"oa7",startTime:192,endTime:199,speaker:"Caret",cue:"By 2026 about a billion people a week are typing into it, and millions of businesses are building on top of it.",read:"The frame fills with thousands of tiny cursors blinking in a vast grid, each one a conversation.",visualPrompt:"Field of thousands of blinking carets forming a living grid.",technicalNote:"Weekly active users were reported passing 800M in late 2025 and around 1B during 2026, with business customers in the millions.",codeSnippet:`weekly users
