// Generative Model:     P(token_{t+1} | tokens_{1..t}) -> Loop until <EOS>
// Discriminative Model: P(Class_k | State, Criteria)   -> Single Matrix Pass!`},{id:"s5-2",chapterId:"ch5",startTime:130,endTime:138,cue:"A generator writes one token, feeds it back into itself, and writes the next, over and over, hundreds of times.",read:"An animation of a typewriter typing letter by letter while a ticking clock sweeps around.",speaker:"Engineer",visualPrompt:'A mechanical typewriter chugging letter by letter: "I", " ", "t", "h", "i", "n", "k"...',technicalNote:"Autoregressive generation has O(N) sequential step latency and requires KV caching and token sampling.",codeSnippet:`// Autoregressive Loop (O(N) passes):
for (let step = 0; step < 120; step++) {
  const nextToken = sample(softmax(W_unembed * hiddenState));
  hiddenState = forward(hiddenState, nextToken); // 20ms * 120 = 2400ms!
}`},{id:"s5-3",chapterId:"ch5",startTime:138,endTime:147,cue:"Jev scores every candidate you gave it at once, in a single forward pass. That's where seventy milliseconds comes from.",read:"A laser sweep passes through all candidates at once; softmax probabilities light up simultaneously in one pulse.",speaker:"Narrator",visualPrompt:"A single high-speed laser pulse illuminating a 3D matrix of candidate vectors instantly in green light.",technicalNote:"One forward pass computes cross-attention between state tokens and candidate criterion embeddings.",codeSnippet:`// Jev Single Forward Pass (O(1) forward pass):
const stateEmbeds = encoder(state);
const candidateScores = crossAttention(stateEmbeds, criteriaEmbeds);
const probabilities = softmax(candidateScores); // 70 milliseconds total!`},{id:"s5-4",chapterId:"ch5",startTime:147,endTime:156,cue:"Which means it cannot ramble, cannot forget a brace, cannot invent an option. The probabilities always sum to one.",read:"A golden lock snaps shut around the schema, guaranteeing 100% type safety.",speaker:"Clawd",visualPrompt:"A golden mathematical shield with zero variance, blocking red glitch artifacts.",technicalNote:"Output space is constrained by the request schema at the mathematical level, not via constrained decoding hacks.",codeSnippet:`// Mathematical Guarantees:
